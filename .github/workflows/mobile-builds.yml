name: Native Android and iPhone apps
# Builds are manual to avoid spending private-repository minutes on each edit.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Files to generate (choose only the platform that needs rebuilding)'
        type: choice
        options: [iphone, android, both]
        default: iphone
      full_checks:
        description: 'Run full iPhone simulator checks (shared tests and Games checks always run)'
        type: boolean
        default: false
      ios_test_scope:
        description: 'Simulator suite when checks are enabled; all retains the system widget-gallery check'
        type: choice
        options: [all, games, camera, location]
        default: all
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    timeout-minutes: 5
    name: Shared tests and all-seven Games verification
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      GAMES_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --test tests/*.test.mjs
      - name: Verify seven modules, original assets, native catalogs and versions
        run: node mobile/tools/verify-games.mjs
  android:
    permissions:
      contents: write
    needs: backend
    if: ${{ inputs.platform == 'android' || inputs.platform == 'both' }}
    timeout-minutes: 15
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore the existing Android signing identity
        id: signing
        env:
          SIGNING_JSON: ${{ secrets.ANDROID_SIGNING }}
        run: |
          python3 - <<'PY'
          import os,json,base64,pathlib
          if not os.environ['SIGNING_JSON']:
              with open(os.environ['GITHUB_OUTPUT'],'a') as output:
                  output.write('variant=debug\napk_name=Asechka-Android-debug.apk\n')
              print('::warning::ANDROID_SIGNING is absent. Building an installable debug-signed APK; it cannot update the release-signed app.')
              raise SystemExit(0)
          signing=json.loads(os.environ['SIGNING_JSON'])
          if not signing['password'] or any(c in signing['password'] for c in '\r\n'):
              raise SystemExit('Invalid Android signing password; restore ANDROID_SIGNING.')
          print('::add-mask::'+signing['password'])
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'asechka-release.jks'
          target.write_bytes(base64.b64decode(signing['keystore'],validate=True))
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write(f"ASECHKA_KEYSTORE_PATH={target}\nASECHKA_KEYSTORE_PASSWORD={signing['password']}\n")
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('variant=release\napk_name=Asechka-Android.apk\n')
          PY
      - name: Build an APK with Android 6 and newer compatibility
        working-directory: mobile/android
        env:
          VARIANT: ${{ steps.signing.outputs.variant }}
        run: |
          chmod +x gradlew
          if [ "$VARIANT" = release ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          ./gradlew --no-daemon testDebugUnitTest "$TASK" 2>&1 | tee build.log
        shell: bash --noprofile --norc -e -o pipefail {0}
      - name: Package Android download
        env:
          VARIANT: ${{ steps.signing.outputs.variant }}
          APK_NAME: ${{ steps.signing.outputs.apk_name }}
        run: |
          mkdir -p output
          cp "mobile/android/app/build/outputs/apk/$VARIANT/app-$VARIANT.apk" "output/$APK_NAME"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "output/$APK_NAME"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "output/$APK_NAME" > output/APK-info.txt
          python3 mobile/tools/verify-games.py --apk "output/$APK_NAME" --badging output/APK-info.txt
          if [ "$VARIANT" = debug ]; then
            printf '%s\n' 'Installable DEBUG APK: ANDROID_SIGNING was absent. Uses the Android debug identity; cannot update an existing release-signed install. Back up local data before removing an existing app. Configure the original ANDROID_SIGNING secret for update-compatible release APKs.' > output/INSTALL.txt
          else
            printf '%s\n' 'Release APK signed with the configured original identity. Transfer the complete APK and open it in Android Files. Keep the same signing identity when updating to retain local data.' > output/INSTALL.txt
          fi
          cat output/INSTALL.txt >> "$GITHUB_STEP_SUMMARY"
          cd output && sha256sum "$APK_NAME" > "$APK_NAME.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Asechka-Android-${{ steps.signing.outputs.variant == 'release' && 'APK' || 'DEBUG-APK' }}
          path: output/*
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Android-build-diagnostics
          path: |
            mobile/android/build.log
            mobile/android/app/build/reports
          retention-days: 3
      - name: Publish verified release to the in-app update feed
        if: ${{ steps.signing.outputs.variant == 'release' && github.ref == 'refs/heads/main' }}
        env:
          ANDROID_RELEASE_NOTES: 'A new Asechka release is ready. Install it here to receive the latest improvements.'
        run: |
          node mobile/tools/publish-android-update.mjs output/Asechka-Android.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/updates
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified Android in-app update'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/asechka-release.jks"
  iphone:
    needs: backend
    if: ${{ inputs.platform == 'iphone' || inputs.platform == 'both' }}
    name: iPhone IPA for sideloading
    runs-on: macos-15
    # A fresh hosted simulator can spend more than ten minutes on its first boot.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate the native Xcode project
        working-directory: mobile/ios
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Build project
        working-directory: mobile/ios
        run: xcodegen generate
      - name: Check renamed widget sharing profiles
        run: |
          swiftc mobile/ios/SharedWidgets/WidgetSnapshot.swift mobile/ios/Sources/SharedHeartStreak.swift mobile/tools/WidgetProfileChecks.swift -o "$RUNNER_TEMP/widget-profile-checks"
          "$RUNNER_TEMP/widget-profile-checks"
      - name: Test native screens, offline posts, and encrypted storage
        if: ${{ inputs.full_checks }}
        working-directory: mobile/ios
        env:
          IOS_TEST_SCOPE: ${{ inputs.ios_test_scope }}
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for values in d["devices"].values() for v in values if "iPhone" in v["name"]))')
          echo "IOS_SIMULATOR=$DEVICE" >> "$GITHUB_ENV"
          FILTER=()
          if [ "$IOS_TEST_SCOPE" = games ]; then
            FILTER=(-only-testing:AsechkaTests -only-testing:AsechkaUITests/GamesJourneyTests)
          fi
          if [ "$IOS_TEST_SCOPE" = camera ]; then
            FILTER=(-only-testing:AsechkaTests -only-testing:AsechkaUITests/FilmJourneyTests)
          fi
          if [ "$IOS_TEST_SCOPE" = location ]; then
            FILTER=(-only-testing:AsechkaTests -only-testing:AsechkaUITests/LocationVaultJourneyTests)
          fi
          xcodebuild -project Asechka.xcodeproj -scheme Asechka -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 -derivedDataPath build-test -resultBundlePath NativeChecks.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- "${FILTER[@]}" test 2>&1 | tee test.log
        shell: bash --noprofile --norc -e -o pipefail {0}
      - name: Capture native iPhone preview
        if: ${{ always() && inputs.full_checks && env.IOS_SIMULATOR != '' }}
        continue-on-error: true
        timeout-minutes: 3
        working-directory: mobile/ios
        env:
          IOS_TEST_SCOPE: ${{ inputs.ios_test_scope }}
        run: |
          mkdir -p preview
          # Compiler failures have no simulator app to install or capture.
          if [ ! -d build-test/Build/Products/Debug-iphonesimulator/Asechka.app ]; then
            echo 'No simulator app was built; compiler diagnostics are in test.log.'
            exit 0
          fi
          xcrun xcresulttool export attachments --path NativeChecks.xcresult --output-path preview/screens
          # Keep useful screenshots and their names, without storing test recordings.
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('preview/screens').rglob('*'):
              if p.is_file() and p.suffix not in ['.png','.json']: p.unlink()
          PY
          # Games journeys already capture their hub, six sheets and settings.
          # Reinstalling the fixture solely for a Home image can stall simctl.
          if [ "$IOS_TEST_SCOPE" = games ] || [ "$IOS_TEST_SCOPE" = camera ] || [ "$IOS_TEST_SCOPE" = location ]; then exit 0; fi
          xcrun simctl boot "$IOS_SIMULATOR" || true
          xcrun simctl bootstatus "$IOS_SIMULATOR" -b
          xcrun simctl install "$IOS_SIMULATOR" build-test/Build/Products/Debug-iphonesimulator/Asechka.app
          xcrun simctl terminate "$IOS_SIMULATOR" app.asechka.ios || true
          xcrun simctl launch "$IOS_SIMULATOR" app.asechka.ios --preview-fixture
          sleep 3
          xcrun simctl io "$IOS_SIMULATOR" screenshot preview/iPhone-home.png
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.full_checks }}
        with:
          name: Native-iPhone-previews
          path: mobile/ios/preview
          retention-days: 3
      - name: Build the iPhone app
        working-directory: mobile/ios
        run: xcodebuild -project Asechka.xcodeproj -scheme Asechka -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
        shell: bash --noprofile --norc -e -o pipefail {0}
      - name: Package IPA for signing by a sideloading tool
        working-directory: mobile/ios
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/Asechka.app package/Payload/
          # Preserve requested shared-data entitlements for the sideload signer to inspect.
          # These ad-hoc signatures still require Apple-ID signing before device installation.
          codesign --force --sign - --entitlements Widgets/Widgets.entitlements package/Payload/Asechka.app/PlugIns/AsechkaWidgets.appex
          codesign --force --sign - --entitlements Asechka.entitlements package/Payload/Asechka.app
          codesign --verify --deep --strict package/Payload/Asechka.app
          cd package
          zip -qry Asechka-iPhone.ipa Payload
          python3 ../../tools/verify-ipa.py Asechka-iPhone.ipa
          python3 ../../tools/verify-games.py --ipa Asechka-iPhone.ipa
          shasum -a 256 Asechka-iPhone.ipa > Asechka-iPhone.ipa.sha256
          printf '%s\n' 'Native iOS 16+ device build prepared for sideload signing; the ad-hoc IPA is NOT device-installable until signed and provisioned by a sideload tool. In Sideloadly leave Remove App Extensions (Plug-ins) UNCHECKED and keep AsechkaWidgets. Sign both app and extension. Install using the same Apple ID/bundle ID, then open Asechka once before searching Add Widget. Messages > Our home-screen widgets reports missing extensions or shared data. Both targets need the same provisioned App Group for personal counts. Signing capabilities depend on your Apple account/profile. This workflow does not upload to TestFlight.' > INSTALL.txt
          cat INSTALL.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Asechka-iPhone-IPA
          path: |
            mobile/ios/package/*.ipa
            mobile/ios/package/*.sha256
            mobile/ios/package/INSTALL.txt
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: iPhone-build-diagnostics
          path: mobile/ios/*.log
          retention-days: 3
