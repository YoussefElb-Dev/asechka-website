name: Native Android and iPhone apps
on:
  workflow_dispatch:
  push:
    branches: [main, codex/little-us]
    paths: ['mobile/**', '.github/workflows/mobile-builds.yml', 'server/**', 'tests/**']
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Shared collection tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --test tests/*.test.mjs
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore the existing Android signing identity
        env:
          SIGNING_JSON: ${{ secrets.ANDROID_SIGNING }}
        run: |
          python3 - <<'PY'
          import os,json,base64,pathlib
          if not os.environ['SIGNING_JSON']:
              raise SystemExit('Add the ANDROID_SIGNING repository secret before building APK updates.')
          signing=json.loads(os.environ['SIGNING_JSON'])
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'asechka-release.jks'
          target.write_bytes(base64.b64decode(signing['keystore']))
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write(f"ASECHKA_KEYSTORE_PATH={target}\nASECHKA_KEYSTORE_PASSWORD={signing['password']}\n")
          PY
      - name: Build an APK with Android 6 and newer compatibility
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - name: Package Android download
        run: |
          mkdir -p output
          cp mobile/android/app/build/outputs/apk/release/app-release.apk output/Asechka-Android.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose output/Asechka-Android.apk
          cd output && sha256sum Asechka-Android.apk > Asechka-Android.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Asechka-Android-APK
          path: output/*
          retention-days: 30
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/asechka-release.jks"
  iphone:
    name: iPhone IPA for sideloading
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate the native Xcode project
        working-directory: mobile/ios
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Build project
        working-directory: mobile/ios
        run: xcodegen generate
      - name: Test native screens, offline posts, and encrypted storage
        working-directory: mobile/ios
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for values in d["devices"].values() for v in values if "iPhone" in v["name"]))')
          echo "IOS_SIMULATOR=$DEVICE" >> "$GITHUB_ENV"
          xcodebuild -project Asechka.xcodeproj -scheme Asechka -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -derivedDataPath build-test -resultBundlePath NativeChecks.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test 2>&1 | tee test.log
        shell: bash --noprofile --norc -e -o pipefail {0}
      - name: Capture native iPhone preview
        if: always()
        continue-on-error: true
        working-directory: mobile/ios
        run: |
          mkdir -p preview
          xcrun xcresulttool export attachments --path NativeChecks.xcresult --output-path preview/screens
          xcrun simctl boot "$IOS_SIMULATOR" || true
          xcrun simctl bootstatus "$IOS_SIMULATOR" -b
          xcrun simctl install "$IOS_SIMULATOR" build-test/Build/Products/Debug-iphonesimulator/Asechka.app
          xcrun simctl terminate "$IOS_SIMULATOR" app.asechka.ios || true
          xcrun simctl launch "$IOS_SIMULATOR" app.asechka.ios --preview-fixture
          sleep 3
          xcrun simctl io "$IOS_SIMULATOR" screenshot preview/iPhone-home.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-iPhone-previews
          path: mobile/ios/preview
          retention-days: 30
      - name: Build the iPhone app
        working-directory: mobile/ios
        run: xcodebuild -project Asechka.xcodeproj -scheme Asechka -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
        shell: bash --noprofile --norc -e -o pipefail {0}
      - name: Package IPA for signing by a sideloading tool
        working-directory: mobile/ios
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/Asechka.app package/Payload/
          cd package
          zip -qry Asechka-iPhone.ipa Payload
          shasum -a 256 Asechka-iPhone.ipa > Asechka-iPhone.ipa.sha256
          printf '%s\n' 'Native iOS 16+ app. Sign this IPA with your sideloading tool and Apple ID before installation. Includes a WidgetKit extension. Keep the extension and provision the same App Group for both targets for personal widget data. Free Personal Teams may not support App Groups.' > INSTALL.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Asechka-iPhone-IPA
          path: |
            mobile/ios/package/*.ipa
            mobile/ios/package/*.sha256
            mobile/ios/package/INSTALL.txt
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: iPhone-build-diagnostics
          path: |
            mobile/ios/*.log
            mobile/ios/build-test/Logs/Test/*.xcresult
            mobile/ios/NativeChecks.xcresult
          retention-days: 7
  delivery:
    name: Keep private build downloads
    needs: [backend, android, iphone]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Keep actionable build diagnostics
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const jobs = await github.rest.actions.listJobsForWorkflowRun({...context.repo, run_id: context.runId});
            const summary = jobs.data.jobs.filter(j => j.name !== 'Keep private build downloads').map(j => ({name:j.name,conclusion:j.conclusion,steps:j.steps.map(s=>({name:s.name,conclusion:s.conclusion}))}));
            fs.writeFileSync(process.env.RUNNER_TEMP+'/build-jobs.json',JSON.stringify(summary,null,2));
            for (const job of jobs.data.jobs.filter(j=>j.conclusion==='failure')) {
              try {
                const response=await fetch(`https://api.github.com/repos/${context.repo.owner}/${context.repo.repo}/actions/jobs/${job.id}/logs`,{headers:{Authorization:'Bearer '+process.env.BUILD_LOG_TOKEN,Accept:'application/vnd.github+json'},redirect:'manual'});
                const location=response.headers.get('location');
                const logs=location ? await (await fetch(location)).text() : await response.text();
                fs.writeFileSync(process.env.RUNNER_TEMP+`/job-${job.id}.log`,logs.split('\n').slice(-250).join('\n'));
              } catch (error) { core.warning('Job log not yet available.'); }
            }
        env:
          BUILD_LOG_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: Asechka-*-*
          path: ${{ runner.temp }}/mobile-downloads
          merge-multiple: true
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: iPhone-build-diagnostics
          path: ${{ runner.temp }}/iphone-diagnostics
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Native-iPhone-previews
          path: ${{ runner.temp }}/iphone-previews
      - name: Save downloads and build status in the private repository
        env:
          SOURCE_SHA: ${{ github.sha }}
          BUILD_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          IPHONE_RESULT: ${{ needs.iphone.result }}
        run: |
          if git ls-remote --exit-code --heads origin codex/mobile-delivery >/dev/null; then
            git fetch origin codex/mobile-delivery
            git checkout -B codex/mobile-delivery FETCH_HEAD
          else
            git checkout -b codex/mobile-delivery
          fi
          mkdir -p mobile-downloads
          find mobile-downloads -mindepth 1 -maxdepth 1 -exec rm -rf {} +
          python3 - <<'PY'
          import os,json,pathlib,shutil,hashlib
          root=pathlib.Path('mobile-downloads')
          temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          for name in ['Asechka-Android.apk','Asechka-Android.apk.sha256','Asechka-iPhone.ipa','Asechka-iPhone.ipa.sha256','INSTALL.txt']:
              source=temp/'mobile-downloads'/name
              if source.is_file(): shutil.copy2(source,root/name)
          for name in ['test.log','build.log']:
              for source in (temp/'iphone-diagnostics').rglob(name): shutil.copy2(source,root/name)
          for source in (temp/'iphone-previews').rglob('*.png'):
              target=root/'previews'/source.name
              target.parent.mkdir(exist_ok=True)
              shutil.copy2(source,target)
          status={'source':os.environ['SOURCE_SHA'],'run':os.environ['BUILD_RUN'],'backend':os.environ['BACKEND_RESULT'],'android':os.environ['ANDROID_RESULT'],'iphone':os.environ['IPHONE_RESULT']}
          if (temp/'build-jobs.json').is_file(): status['jobs']=json.loads((temp/'build-jobs.json').read_text())
          for source in temp.glob('job-*.log'): shutil.copy2(source,root/source.name)
          status['files']={p.name:{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in root.iterdir() if p.suffix in ['.apk','.ipa']}
          (root/'status.json').write_text(json.dumps(status,indent=2)+'\n')
          PY
          git config user.name 'Asechka app builds'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- mobile-downloads
          git commit -m "Keep native build downloads for ${SOURCE_SHA:0:7}" || git diff --cached --quiet
          git push origin HEAD:refs/heads/codex/mobile-delivery
