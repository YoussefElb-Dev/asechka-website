name: Native Android and iPhone apps
# Builds are manual to avoid spending private-repository minutes on each edit.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Files to generate (choose only the platform that needs rebuilding)'
        type: choice
        options: [iphone, android, both]
        default: iphone
      full_checks:
        description: 'Run backend and full iPhone simulator checks (uses extra runner time)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    if: ${{ inputs.full_checks }}
    timeout-minutes: 5
    name: Shared collection tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --test tests/*.test.mjs
  android:
    if: ${{ inputs.platform == 'android' || inputs.platform == 'both' }}
    timeout-minutes: 15
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore the existing Android signing identity
        env:
          SIGNING_JSON: ${{ secrets.ANDROID_SIGNING }}
        run: |
          python3 - <<'PY'
          import os,json,base64,pathlib
          if not os.environ['SIGNING_JSON']:
              raise SystemExit('Add the ANDROID_SIGNING repository secret before building APK updates.')
          signing=json.loads(os.environ['SIGNING_JSON'])
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'asechka-release.jks'
          target.write_bytes(base64.b64decode(signing['keystore']))
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write(f"ASECHKA_KEYSTORE_PATH={target}\nASECHKA_KEYSTORE_PASSWORD={signing['password']}\n")
          PY
      - name: Build an APK with Android 6 and newer compatibility
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease
      - name: Package Android download
        run: |
          mkdir -p output
          cp mobile/android/app/build/outputs/apk/release/app-release.apk output/Asechka-Android.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose output/Asechka-Android.apk
          cd output && sha256sum Asechka-Android.apk > Asechka-Android.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Asechka-Android-APK
          path: output/*
          retention-days: 30
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/asechka-release.jks"
  iphone:
    if: ${{ inputs.platform == 'iphone' || inputs.platform == 'both' }}
    name: iPhone IPA for sideloading
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate the native Xcode project
        working-directory: mobile/ios
        run: brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
      - name: Build project
        working-directory: mobile/ios
        run: xcodegen generate
      - name: Test native screens, offline posts, and encrypted storage
        if: ${{ inputs.full_checks }}
        working-directory: mobile/ios
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for values in d["devices"].values() for v in values if "iPhone" in v["name"]))')
          echo "IOS_SIMULATOR=$DEVICE" >> "$GITHUB_ENV"
          xcodebuild -project Asechka.xcodeproj -scheme Asechka -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 180 -derivedDataPath build-test -resultBundlePath NativeChecks.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- test 2>&1 | tee test.log
        shell: bash --noprofile --norc -e -o pipefail {0}
      - name: Capture native iPhone preview
        if: ${{ always() && inputs.full_checks && env.IOS_SIMULATOR != '' }}
        continue-on-error: true
        working-directory: mobile/ios
        run: |
          mkdir -p preview
          xcrun xcresulttool export attachments --path NativeChecks.xcresult --output-path preview/screens
          # Keep useful screenshots and their names, without storing test recordings.
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('preview/screens').rglob('*'):
              if p.is_file() and p.suffix not in ['.png','.json']: p.unlink()
          PY
          xcrun simctl boot "$IOS_SIMULATOR" || true
          xcrun simctl bootstatus "$IOS_SIMULATOR" -b
          xcrun simctl install "$IOS_SIMULATOR" build-test/Build/Products/Debug-iphonesimulator/Asechka.app
          xcrun simctl terminate "$IOS_SIMULATOR" app.asechka.ios || true
          xcrun simctl launch "$IOS_SIMULATOR" app.asechka.ios --preview-fixture
          sleep 3
          xcrun simctl io "$IOS_SIMULATOR" screenshot preview/iPhone-home.png
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.full_checks }}
        with:
          name: Native-iPhone-previews
          path: mobile/ios/preview
          retention-days: 3
      - name: Build the iPhone app
        working-directory: mobile/ios
        run: xcodebuild -project Asechka.xcodeproj -scheme Asechka -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
        shell: bash --noprofile --norc -e -o pipefail {0}
      - name: Package IPA for signing by a sideloading tool
        working-directory: mobile/ios
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/Asechka.app package/Payload/
          # Preserve requested shared-data entitlements for the sideload signer to inspect.
          # These ad-hoc signatures still require Apple-ID signing before device installation.
          codesign --force --sign - --entitlements Widgets/Widgets.entitlements package/Payload/Asechka.app/PlugIns/AsechkaWidgets.appex
          codesign --force --sign - --entitlements Asechka.entitlements package/Payload/Asechka.app
          codesign --verify --deep --strict package/Payload/Asechka.app
          cd package
          zip -qry Asechka-iPhone.ipa Payload
          python3 ../../tools/verify-ipa.py Asechka-iPhone.ipa
          shasum -a 256 Asechka-iPhone.ipa > Asechka-iPhone.ipa.sha256
          printf '%s\n' 'Native iOS 16+ app. In Sideloadly leave Remove App Extensions (Plug-ins) UNCHECKED and keep AsechkaWidgets. Sign both app and extension. Install using the same Apple ID/bundle ID, then open Asechka once before searching Add Widget. Messages > Our home-screen widgets now reports missing extensions or shared data. Both targets need the same provisioned App Group (group.app.asechka.shared) for personal counts. Signing capabilities depend on your Apple account/profile.' > INSTALL.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Asechka-iPhone-IPA
          path: |
            mobile/ios/package/*.ipa
            mobile/ios/package/*.sha256
            mobile/ios/package/INSTALL.txt
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: iPhone-build-diagnostics
          path: mobile/ios/*.log
          retention-days: 3
