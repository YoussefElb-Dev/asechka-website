<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>/* LEAFLET_CSS */
html,body,#map{height:100%;margin:0;background:#eaf1fc}.leaflet-control-attribution{font:8px sans-serif!important}.person{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#6b5cb5;color:white;border:3px solid white;font:600 12px sans-serif;box-shadow:0 2px 8px #26345133}.person.y{background:#557ea7}.leaflet-container{font-family:sans-serif}</style></head><body><div id="map" role="img" aria-label="Our shared location map"></div><script>/* LEAFLET */</script><script>
const map=L.map('map',{zoomControl:false,scrollWheelZoom:false,dragging:true,attributionControl:true}).setView([25,0],1);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,referrerPolicy:'origin',attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);const layer=L.layerGroup().addTo(map);let key='';window.showPeople=people=>{const pins=(people||[]).filter(p=>p.position&&Date.now()-p.position.capturedAt<300000);const next=JSON.stringify(pins.map(p=>[p.actor,p.position.latitude,p.position.longitude]));if(next===key)return;key=next;layer.clearLayers();for(const p of pins){L.marker([p.position.latitude,p.position.longitude],{icon:L.divIcon({className:'',html:'<div class="person '+(p.actor==='youssef'?'y':'')+'">'+(p.actor==='asnat'?'A':'Y')+'</div>',iconSize:[34,34],iconAnchor:[17,17]})}).addTo(layer).bindTooltip(p.actor==='asnat'?'Asnat':'Youssef');}if(pins.length===1)map.setView([pins[0].position.latitude,pins[0].position.longitude],14);else if(pins.length>1)map.fitBounds(pins.map(p=>[p.position.latitude,p.position.longitude]),{padding:[25,20],maxZoom:16});};
</script></body></html>
