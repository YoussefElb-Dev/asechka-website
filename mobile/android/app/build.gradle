plugins { id 'com.android.application' }
android {
    namespace 'app.asechka.android'
    compileSdk 36
    defaultConfig {
        applicationId 'app.asechka.android'
        minSdk 23
        targetSdk 36
        versionCode 17
        versionName '2.2.8'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    // Keep the sideloaded APK readable by legacy and current Android installers.
    signingConfigs.configureEach { enableV1Signing = true; enableV2Signing = true; enableV3Signing = true }
    signingConfigs {
        release {
            if (System.getenv('ASECHKA_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ASECHKA_KEYSTORE_PATH'))
                storePassword System.getenv('ASECHKA_KEYSTORE_PASSWORD')
                keyAlias 'asechka'
                keyPassword System.getenv('ASECHKA_KEYSTORE_PASSWORD')
            }
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }
    buildTypes { release { minifyEnabled false; if (System.getenv('ASECHKA_KEYSTORE_PATH')) signingConfig signingConfigs.release } }
}
